[project]
name = "truefrontier-chromecli"
version = "0.12.0"
description = "Installs truefrontier-webcli, which provides the chromecli command (read and act in the Chrome tabs you share with agents)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Brandname Maker LLC dba True Frontier" }]
keywords = ["cli", "agent", "chrome", "extension", "tabs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["truefrontier-webcli==0.12.0"]

[project.urls]
Homepage = "https://github.com/truefrontier/webcli"
Repository = "https://github.com/truefrontier/webcli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/README.md"]
