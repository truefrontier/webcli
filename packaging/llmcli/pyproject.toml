[project]
name = "truefrontier-llmcli"
version = "0.6.2"
description = "Installs webcli, which provides the llmcli command (chat AIs over your own signed-in Chrome)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Brandname Maker LLC dba True Frontier" }]
keywords = ["cli", "agent", "llm", "gemini", "chatgpt", "muse", "notebooklm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["truefrontier-webcli==0.16.1"]

[project.urls]
Homepage = "https://pypi.org/project/truefrontier-webcli/"
Repository = "https://pypi.org/project/truefrontier-webcli/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/README.md"]
