# Offline CI for truefrontier/webcli.
# No signed-in Chrome profile, no site network, no secrets.
# Playwright's headless Chromium and ffmpeg are not installed here. Tests that
# need them skip themselves. Two tests are xfail until Kevin chooses a fix:
# tests/test_chromecli.py::test_extension_id_matches_the_committed_key
# tests/test_whatsapp.py::test_read_since

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml: requires-python >=3.10, classifiers 3.10–3.13.
        # 3.12 and 3.13 are the small matrix. 3.10 is omitted: webcli/feed/pull.py
        # imports tomllib, which is stdlib only on 3.11+.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and pytest
        run: python -m pip install -e . pytest
      - name: Run pytest
        run: python -m pytest -q

  chromecli:
    name: chromecli extension (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Current Node.js LTS line. Verified nodejs.org/dist 2026-10-30: v26.13.0 (Lithium).
          node-version: "26"
      - name: Run extension tests
        run: node --test extensions/chromecli/test
