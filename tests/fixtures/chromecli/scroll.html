<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chromecli fixture: scroll</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; }
  header { height: 48px; display: flex; align-items: center; padding: 0 16px; background: #eef; }
  /* An inner scroll container like signNow's document viewer: about 5 viewports of content. */
  #viewer { height: 80vh; overflow-y: auto; margin: 0 16px; border: 1px solid #99a; scroll-behavior: smooth; }
  .sheet { height: 40vh; margin: 8px; background: linear-gradient(#fff, #dde); border: 1px solid #ccd;
           display: flex; align-items: center; justify-content: center; font-size: 28px; }
  #small { height: 60px; width: 200px; overflow: auto; margin: 16px; border: 1px dashed #999; }
  #small pre { margin: 0; }
  /* The window scrolls too (the footer is taller than the viewport). */
  footer { height: 150vh; padding: 16px; background: #f6f6f6; }
</style>
</head>
<body>
<!-- Safe local page for chromecli scroll / screenshot --full-page (0.10.2): nothing gated, no network. -->
<header><h1 style="font-size:18px;margin:0">Agreement viewer (10 pages)</h1></header>
<div id="viewer" aria-label="Document viewer"></div>
<div id="small"><pre>a small scroll box
line 2
line 3
line 4
line 5
line 6
line 7
line 8</pre></div>
<x-shadow-viewer id="shadow-host" hidden></x-shadow-viewer>
<footer><p id="end-of-window">End of the window scroll.</p></footer>
<script>
  const viewer = document.getElementById("viewer");
  for (let i = 1; i <= 10; i++) {
    const d = document.createElement("div");
    d.className = "sheet"; d.id = "sheet-" + i; d.textContent = "Page " + i;
    viewer.appendChild(d);
  }
  // An open shadow root with its own scroller (web-component viewers); shown by tests that hide #viewer.
  customElements.define("x-shadow-viewer", class extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: "open" });
      root.innerHTML = '<style>.pane{height:70vh;overflow-y:scroll;margin:0 16px}.p{height:50vh;border:1px solid #aaa;margin:6px}</style>' +
        '<div class="pane" id="pane">' + Array.from({ length: 6 }, (_, i) => '<div class="p">Shadow page ' + (i + 1) + '</div>').join("") + '</div>';
    }
  });
</script>
</body>
</html>
