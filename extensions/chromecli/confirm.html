        <rect x="12.5" y="14.9" width="5" height="2.1" rx="1.05" fill="#5B9BFF"/>

    <span id="timer" class="pill timer" role="timer" aria-live="off"><span class="dot" aria-hidden="true"></span><span id="timer-label">60s</span></span>

  <main>
    <section class="hero" aria-labelledby="headline">
      <span id="fav" class="fav hero-fav" aria-hidden="true"><svg class="op-ic"><use id="op-use" href="#i-click"/></svg></span>

        <p class="eyebrow">An agent wants to</p>
        <h1 id="headline">…</h1>
        <p id="site" class="site"></p>
      </div>
    </section>

    <section class="card reasons-card" aria-labelledby="reasons-title">
      <h2 id="reasons-title"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>Gated because</h2>
      <ul id="reasons" class="reasons"></ul>
    </section>

    <section class="card details" aria-label="Details">
      <dl id="details"></dl>
      <div id="html-wrap" class="html-wrap" hidden>
        <div class="html-label">Element HTML</div>
        <pre id="html" class="html"></pre>
      </div>
    </section>

    <p id="error" class="msg err" hidden></p>
  </main>

  <footer class="actions">
    <div class="bar" aria-hidden="true"><span id="bar-fill"></span></div>
    <div class="actions-row">
      <span id="queue" class="queue"></span>
      <button id="deny" class="btn btn-lg" autofocus>Deny</button>
      <button id="allow" class="btn btn-lg btn-allow" disabled>Allow once</button>
    </div>
    <p class="fine"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg>Closing or ignoring this window denies. Nothing runs until you choose.</p>
  </footer>
  <script type="module" src="confirm.js"></script>
