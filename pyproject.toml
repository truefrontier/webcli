[project]
name = "truefrontier-webcli"
version = "0.17.0"
description = "Agent-native CLIs (webcli, llmcli, chromecli) over your own signed-in Chrome sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Brandname Maker LLC dba True Frontier" }]
keywords = ["cli", "agent", "chrome", "playwright", "automation", "headless", "llm", "gemini", "chatgpt", "gmail", "amazon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.40",
    "click>=8.1",
    "rich>=13",
    "tomli>=1.1; python_version < '3.11'",
]

[project.scripts]
webcli = "webcli.apps.webcli:main"
llmcli = "webcli.apps.llmcli:main"
chromecli = "webcli.apps.chromecli:main"
chromecli-host = "webcli.chromecli.host:entry"

[project.entry-points."webcli.sites"]
gemini = "webcli.sites.gemini:ADAPTER"
chatgpt = "webcli.sites.chatgpt:ADAPTER"
muse = "webcli.sites.muse:ADAPTER"
aa = "webcli.sites.aa:ADAPTER"
walkie = "webcli.sites.walkie:ADAPTER"
keep = "webcli.sites.keep:ADAPTER"
photos = "webcli.sites.photos:ADAPTER"
gnews = "webcli.sites.gnews:ADAPTER"
perplexity = "webcli.sites.perplexity:ADAPTER"
youtube = "webcli.sites.youtube:ADAPTER"
recorder = "webcli.sites.recorder:ADAPTER"
contacts = "webcli.sites.contacts:ADAPTER"
gmail = "webcli.sites.gmail:ADAPTER"
loom = "webcli.sites.loom:ADAPTER"
facebook = "webcli.sites.facebook:ADAPTER"
linkedin = "webcli.sites.linkedin:ADAPTER"
messages = "webcli.sites.messages:ADAPTER"
whatsapp = "webcli.sites.whatsapp:ADAPTER"
notebooklm = "webcli.sites.notebooklm:ADAPTER"
amazon = "webcli.sites.amazon:ADAPTER"

[project.urls]
Homepage = "https://github.com/truefrontier/webcli"
Repository = "https://github.com/truefrontier/webcli"
Issues = "https://github.com/truefrontier/webcli/issues"

[tool.hatch.build.targets.wheel]
packages = ["webcli"]

[tool.hatch.build.targets.sdist]
include = ["/webcli", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
